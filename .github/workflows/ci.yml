name: Flutter CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skills:
    name: Validate AI skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install validator dependency
        run: python3 -m pip install -r tool/requirements-skills.txt
      - name: Validate discovery and references
        run: python3 tool/validate_skills.py
      - name: Test token helper
        run: python3 -m unittest discover -s tool/tests -v
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Generate primitive token smoke sample
        run: |
          python3 .agents/skills/flutter-design-tokens/scripts/generate_tokens.py \
            --input .agents/skills/flutter-design-tokens/references/example.tokens.json \
            --output packages/nusantara_ui/lib/src/tokens/generated_tokens_smoke.dart
      - name: Format, analyze and test
        run: |
          trap 'rm -f packages/nusantara_ui/lib/src/tokens/generated_tokens_smoke.dart' EXIT
          ./tool/check.sh
      - name: Build catalog
        working-directory: apps/catalog
        run: flutter build web --release
      - name: Upload catalog build
        uses: actions/upload-artifact@v7
        with:
          name: catalog-web
          path: apps/catalog/build/web
